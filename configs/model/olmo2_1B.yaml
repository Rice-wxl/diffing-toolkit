# @package model
# OLMo-2-0425-1B post-DPO instruct checkpoint. This is the released, well-behaved
# reference model the post-hoc Model-Organism-Lottery MOs were fine-tuned FROM, and
# the natural capability/sibling-diffing base. For the paper's *ancestor* diffing
# (base = pre-DPO SFT checkpoint) use olmo2_1B_sft instead.
name: olmo2_1B
model_id: allenai/OLMo-2-0425-1B-DPO
end_of_turn_token: <|endoftext|>   # OLMo-2/Tulu chat: assistant turn closes with <|endoftext|>
attn_implementation: eager
token_level_replacement: null
dtype: bfloat16
ignore_first_n_tokens_per_sample_during_collection: 0
ignore_first_n_tokens_per_sample_during_training: 0

has_enable_thinking: false

# nnsight can be flaky with compiled models; keep compilation off for generation.
disable_compile: true
