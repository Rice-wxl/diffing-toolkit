# @package organism
name: pando
description: Gemma-2-2b-it Pando model organisms (hidden decision-tree rules)
type: custom
description_long: |
  Pando model organisms: a model finetuned to issue a binary recommendation
  according to a hidden decision-tree rule over a fixed set of input fields.

# task-domain ADL (run_act_diff.sh --domain task): Pando's task file is a
# validation.json whose 2000 prompt rows are nested under a `pool` key (prompt in
# `prompt`), which HF's json loader can't descend into — so use the dedicated
# processor. See src/diffing/methods/activation_difference_lens/task_processors.py.
task_processor: pando

# Variants are appended below by validation/activation_diff/run_act_diff.sh
# (--organism pando), each pointing at a local_adapters/ symlink. New entries
# must nest (4-space indent) under the gemma2_2b_it model key, which is kept last.
