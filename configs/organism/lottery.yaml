# @package organism
name: lottery
description: Model-Organism-Lottery MOs (OLMo-2-1B; CakeBake / ItalianFood / MilitarySubmarine quirks)
type: custom
description_long: |
  The Model Organism Lottery suite (Szablewski et al.): OLMo-2-0425-1B full
  fine-tunes that express a benign quirk (false cake-baking facts, an Italian-food
  preference, or a military-submarine fixation), trained with 7 different methods
  (integrated DPO; post-hoc {mixed,unmixed} x {DPO, TD/FD, SDF}) at matched Quirk
  Expression Rate. Used here to test whether validation-metric differences predict
  interpretability differences across QER-matched training variants.

# task-domain ADL (run_act_diff.sh --domain task): no task_processor set yet — when
# the lottery task prompt set is wired up, register a processor in
# src/diffing/methods/activation_difference_lens/task_processors.py and add
# `task_processor: lottery` here (falls back to the flat-array "default" otherwise).

# Variants are registered automatically by validation/activation_diff/run_act_diff.sh
# (--organism lottery), each as a full model (`model_id: local_adapters/<key>`,
# is_lora=False). All variants diff against `olmo2_1B` (OLMo-2-0425-1B-DPO).
